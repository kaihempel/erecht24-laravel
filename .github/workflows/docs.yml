name: deploy-docs

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_NUMBER: ${{ github.run_number }}  

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      - name: Build docs
        run: npm run build
        working-directory: docs

      - name: Create build.zip
        run: zip -r build.zip docs/dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-artifacts
          path: build.zip
          retention-days: 3

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Deploy
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    environment: 'github-pages'

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: deploy-artifacts

      # ── SSH setup ─────────────────────────────────────────────────────────
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

          cat >> ~/.ssh/config <<EOF
          Host target
            HostName ${{ secrets.SERVER_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          EOF

      # ── Prepare release directory on server ───────────────────────────────
      - name: Create release directory
        run: |
          ssh target "mkdir -p ${{ secrets.DEPLOY_PATH }}/releases/${{ env.BUILD_NUMBER }}"

      # ── Upload & extract build ────────────────────────────────────────────
      - name: Upload build to server
        run: |
          scp build.zip target:${{ secrets.DEPLOY_PATH }}/releases/${{ env.BUILD_NUMBER }}/

      - name: Extract build on server
        run: |
          ssh target "
            cd ${{ secrets.DEPLOY_PATH }}/releases/${{ env.BUILD_NUMBER }} \
            && unzip -o build.zip \
            && rm build.zip
          "

      # ── Link shared storage into release ──────────────────────────────────
      - name: Symlink shared storage into release
        run: |
          ssh target "
            rm -rf ${{ secrets.DEPLOY_PATH }}/releases/${{ env.BUILD_NUMBER }}/storage \
            && ln -s ${{ secrets.DEPLOY_PATH }}/storage \
                      ${{ secrets.DEPLOY_PATH }}/releases/${{ env.BUILD_NUMBER }}/storage
          "
          
      # ── Atomic symlink swap ───────────────────────────────────────────────
      - name: Switch 'current' symlink to new release
        run: |
          ssh target "
            ln -sfn ${{ secrets.DEPLOY_PATH }}/releases/${{ env.BUILD_NUMBER }} \
                     ${{ secrets.DEPLOY_PATH }}/current
          "

      # ── Cleanup old releases (keep last 5) ────────────────────────────────
      - name: Remove old releases
        run: |
          ssh target "
            cd ${{ secrets.DEPLOY_PATH }}/releases \
            && ls -1d */ | sort -n | head -n -5 | xargs -r rm -rf
          "

      # ── Cleanup SSH key ───────────────────────────────────────────────────
      - name: Cleanup SSH credentials
        if: always()
        run: rm -rf ~/.ssh/deploy_key
