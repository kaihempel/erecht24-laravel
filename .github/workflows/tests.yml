name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - laravel: '12'
            php-version: ['8.3']
            testbench_constraint: ^10.11
            pest_constraint: ^3.8
            pest_laravel_constraint: ^3.2
          - laravel: '13'
            php-version: ['8.5']
            testbench_constraint: ^11.1
            pest_constraint: ^4.7
            pest_laravel_constraint: ^4.1

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, json
          tools: composer:v2
          coverage: none

      - name: Select Laravel version
        run: composer require --no-update "illuminate/support:${{ matrix.laravel_constraint }}"

      - name: Select test dependency versions
        run: composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench_constraint }}" "pestphp/pest:${{ matrix.pest_constraint }}" "pestphp/pest-plugin-laravel:${{ matrix.pest_laravel_constraint }}"    

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run tests
        run: vendor/bin/pest
        
  tests:
    name: tests
    runs-on: ubuntu-latest
    needs:
      - test
    if: ${{ always() }}
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            exit 1
          fi
