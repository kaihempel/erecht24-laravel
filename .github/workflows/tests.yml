name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - laravel: '12'
            php-version: ['8.3']
            testbench_constraint: ^10.11
            pest_constraint: ^3.8
            pest_laravel_constraint: ^3.2
          - laravel: '13'
            php-version: ['8.5']
            testbench_constraint: ^11.1
            pest_constraint: ^4.7
            pest_laravel_constraint: ^4.1

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, json
          tools: composer:v2
          coverage: none

      - name: Select Laravel version
        run: composer require --no-update "illuminate/support:${{ matrix.laravel_constraint }}"

      - name: Select test dependency versions
        run: composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench_constraint }}" "pestphp/pest:${{ matrix.pest_constraint }}" "pestphp/pest-plugin-laravel:${{ matrix.pest_laravel_constraint }}"    

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run tests
        run: vendor/bin/pest
