name: lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run Pint
        run: composer lint

      - name: Run PHPStan
        run: composer analyse

      - name: Check dist archive
        run: |
          if git archive --format=tar HEAD | tar -t | grep -E '^(\.claude|\.specify|specs|docs|tests)/|^(CLAUDE\.md|phpstan\.neon)$'; then
            echo "Development-only files found in the dist archive" >&2
            exit 1
          fi
